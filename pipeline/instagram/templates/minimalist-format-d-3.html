<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1350">
  <title>Format D - Card 3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>*{font-family:'Pretendard',sans-serif;}.carousel-card{width:1080px;height:1350px;}</style>
</head>
<body class="bg-white">
  <div class="carousel-card relative overflow-hidden bg-white flex flex-col">
    <div class="flex items-center justify-center pt-12 px-8">
      <div class="flex items-center gap-3">
        <span class="px-4 py-1.5 rounded-full bg-gradient-to-r from-#2563eb to-#7c3aed text-white text-sm font-semibold">펀치 브리핑</span>
        <span class="w-12 h-px bg-gradient-to-r from-#2563eb to-#7c3aed"></span>
        <span class="text-gray-400 text-sm">3/5</span>
      </div>
    </div>
    <div class="flex-1 flex flex-col">
      <div class="flex flex-col items-center justify-center px-16 py-20 relative">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-1 bg-gradient-to-r from-#2563eb via-#7c3aed to-#14b8a6"></div>
        <div class="absolute top-16 left-16 text-blue-600 font-bold text-4xl">3</div>
        <div class="text-center z-10">
          <p class="text-2xl font-semibold text-gray-500 mb-6">반전: AI가 놓치는 것</p>
          <div class="bg-gradient-to-br from-purple-50 to-blue-50 rounded-2xl p-10 mb-8 max-w-3xl mx-auto border border-purple-100 relative">
            <svg class="absolute top-6 left-6 w-12 h-12 text-purple-200" fill="currentColor" viewBox="0 0 24 24"><path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.431.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.431.917-3.995 3.638-3.995 5.849h3.983v10h-9.983z"/></svg>
            <p class="text-2xl font-medium text-gray-800 leading-tight mb-6 relative z-10">"애들한테 자살 챌린지 올리는 놈들은 알고리즘 피하는 데 <span class="text-purple-600 font-bold">도가 텄다</span>"</p>
            <div class="w-20 h-0.5 bg-purple-500 mx-auto mb-6"></div>
            <p class="text-lg text-gray-700 leading-relaxed relative z-10">유해 콘텐츠는 계속 변한다<br><span class="font-bold text-gray-900">AI도 사람이 계속 업데이트해줘야 한다</span></p>
          </div>
          <p class="text-sm text-gray-500">— 익명의 틱톡 검수 직원 내부 게시판 글</p>
        </div>
      </div>
    </div>
    <div class="absolute bottom-16 left-1/2 -translate-x-1/2 flex items-center gap-3">
      <span class="w-8 h-8 rounded-full bg-gradient-to-r from-#2563eb to-#7c3aed flex items-center justify-center text-white font-bold text-xs">AI</span>
      <span class="text-gray-400 text-sm font-medium">aikorea24.kr</span>
    </div>
  </div>
</body>
</html>
