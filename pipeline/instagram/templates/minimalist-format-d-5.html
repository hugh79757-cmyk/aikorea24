<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1350">
  <title>Format D - Card 5</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>*{font-family:'Pretendard',sans-serif;}.carousel-card{width:1080px;height:1350px;}</style>
</head>
<body class="bg-white">
  <div class="carousel-card relative overflow-hidden bg-white flex flex-col">
    <div class="flex items-center justify-center pt-12 px-8">
      <div class="flex items-center gap-3">
        <span class="px-4 py-1.5 rounded-full bg-gradient-to-r from-#2563eb to-#7c3aed text-white text-sm font-semibold">펀치 브리핑</span>
        <span class="w-12 h-px bg-gradient-to-r from-#2563eb to-#7c3aed"></span>
        <span class="text-gray-400 text-sm">5/5</span>
      </div>
    </div>
    <div class="flex-1 flex flex-col">
      <div class="flex flex-col items-center justify-center px-16 py-20 relative text-center">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-1 bg-gradient-to-r from-#2563eb via-#7c3aed to-#14b8a6"></div>
        <div class="absolute top-16 left-16 text-blue-600 font-bold text-4xl">5</div>
        <div class="z-10 max-w-2xl">
          <p class="text-3xl font-extrabold text-gray-900 leading-tight mb-6">
            최악을 막아주던 사람이 사라진 자리에<br>
            그걸 자꾸 놓치는 AI가 들어올 때,
          </p>
          <p class="text-xl text-gray-600 leading-relaxed mb-10 max-w-2xl">
            당신 피드는 더 안전해지는 걸까<br>
            아니면 그 반대일까.
          </p>
          <a href="https://aikorea24.kr" class="inline-flex items-center gap-3 px-8 py-4 rounded-2xl bg-gradient-to-r from-#2563eb to-#7c3aed text-white font-bold text-lg shadow-lg hover:from-blue-500 hover:to-purple-500 transition-all">
            전체 기사 읽으러 가기
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
          </a>
        </div>
      </div>
    </div>
    <div class="absolute bottom-16 left-1/2 -translate-x-1/2 flex items-center gap-3">
      <span class="w-8 h-8 rounded-full bg-gradient-to-r from-#2563eb to-#7c3aed flex items-center justify-center text-white font-bold text-xs">AI</span>
      <span class="text-gray-400 text-sm font-medium">aikorea24.kr</span>
    </div>
  </div>
</body>
</html>
