<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1350">
  <title>Format D - Card 1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>*{font-family:'Pretendard',sans-serif;}.carousel-card{width:1080px;height:1350px;}</style>
</head>
<body class="bg-white">
  <div class="carousel-card relative overflow-hidden bg-white flex flex-col">
    <div class="flex items-center justify-center pt-12 px-8">
      <div class="flex items-center gap-3">
        <span class="px-4 py-1.5 rounded-full bg-gradient-to-r from-#2563eb to-#7c3aed text-white text-sm font-semibold">펀치 브리핑</span>
        <span class="w-12 h-px bg-gradient-to-r from-#2563eb to-#7c3aed"></span>
        <span class="text-gray-400 text-sm">1/5</span>
      </div>
    </div>
    <div class="flex-1 flex flex-col">
      <div class="flex flex-col items-center justify-center px-16 py-20 relative">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-1 bg-gradient-to-r from-#2563eb via-#7c3aed to-#14b8a6"></div>
        <div class="absolute top-16 left-16 text-blue-600 font-bold text-4xl">1</div>
        <div class="text-center z-10">
          <p class="text-5xl font-extrabold text-gray-900 leading-tight mb-8 tracking-tight">
            틱톡이 감원한다던<br>
            <span class="text-blue-600">667명</span> 의 정체
          </p>
          <div class="w-24 h-1 bg-gradient-to-r from-#2563eb to-#7c3aed mx-auto mb-8"></div>
          <p class="text-xl text-gray-600 font-medium leading-relaxed max-w-2xl mx-auto">
            "약 300명"이라던 공식 발표<br>
            내부 문서엔 <span class="font-bold text-gray-900">2배 넘는 667명</span>
          </p>
        </div>
      </div>
    </div>
    <div class="absolute bottom-16 left-1/2 -translate-x-1/2 flex items-center gap-3">
      <span class="w-8 h-8 rounded-full bg-gradient-to-r from-#2563eb to-#7c3aed flex items-center justify-center text-white font-bold text-xs">AI</span>
      <span class="text-gray-400 text-sm font-medium">aikorea24.kr</span>
    </div>
    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex items-center gap-2 text-gray-300 text-sm animate-bounce">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      <span>왼쪽으로 넘겨보기</span>
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
    </div>
  </div>
</body>
</html>
