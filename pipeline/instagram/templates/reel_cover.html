<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Instagram Reel Cover</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v2/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      word-break: keep-all;
    }

    :root {
      --bg-hook: linear-gradient(135deg, #1a0533 0%, #0D1117 100%);
      --bg-conflict: linear-gradient(135deg, #330a0a 0%, #0D1117 100%);
      --bg-twist: linear-gradient(135deg, #0a1a33 0%, #0D1117 100%);
      --bg-expansion: #1a1a2e;
      --bg-cta: linear-gradient(135deg, #0a3314 0%, #0D1117 100%);
      --bg-link: #0D1117;
      --bg-brand: linear-gradient(135deg, #0D1117 0%, #1a0533 100%);
      --accent-purple: #A855F7;
      --accent-red: #EF4444;
      --accent-blue: #3B82F6;
      --accent-green: #22C55E;
    }

    .slide {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: #ffffff;
    }

    .slide.bg-hook { background: var(--bg-hook); }
    .slide.bg-conflict { background: var(--bg-conflict); }
    .slide.bg-twist { background: var(--bg-twist); }
    .slide.bg-expansion { background: var(--bg-expansion); }
    .slide.bg-cta { background: var(--bg-cta); }
    .slide.bg-link { background: var(--bg-link); }
    .slide.bg-brand { background: var(--bg-brand); }

    /* Decorative blur orbs */
    .slide::before {
      content: '';
      position: absolute;
      top: -160px;
      right: -160px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: rgba(168, 85, 247, 0.08);
      filter: blur(100px);
      pointer-events: none;
    }
    .slide::after {
      content: '';
      position: absolute;
      bottom: -160px;
      left: -160px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.06);
      filter: blur(100px);
      pointer-events: none;
    }

    .slide-inner {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 120px 72px;
    }

    /* Top section: emoji + highlight (40% of height) */
    .top-section {
      flex: 0 0 40%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .emoji-prefix {
      font-size: 80px;
      line-height: 1;
      margin-bottom: 32px;
      display: block;
    }

    .highlight-number {
      font-size: 140px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -4px;
      background: linear-gradient(135deg, #A855F7, #3B82F6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Middle section: title + body (35% of height) */
    .middle-section {
      flex: 0 0 35%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .title {
      font-size: 56px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 40px;
      color: #ffffff;
    }

    .divider {
      width: 72px;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-blue));
      border-radius: 2px;
      margin-bottom: 40px;
    }

    .body {
      font-size: 32px;
      font-weight: 400;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.7);
      max-width: 900px;
    }

    /* Bottom section: branding */
    .bottom-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding-bottom: 40px;
    }

    .subtitle {
      font-size: 22px;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 500;
      margin-bottom: 24px;
    }

    .branding-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
    }

    .brand-text {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 500;
    }

    /* Brand watermark */
    .brand-watermark {
      position: absolute;
      bottom: 48px;
      right: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0.3;
    }

    .brand-watermark .brand-icon-sm {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
    }

    .brand-watermark .brand-text-sm {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
    }
  </style>
</head>
<body style="background: #000;">
  <div class="slide $bg_class">
    <div class="slide-inner">
      <div class="top-section">
        <span class="emoji-prefix">$emoji_prefix</span>
        <div class="highlight-number">$highlight_number</div>
      </div>

      <div class="middle-section">
        <div class="title">$title</div>
        <div class="divider"></div>
        <div class="body">$body</div>
      </div>

      <div class="bottom-section">
        <div class="subtitle">$subtitle</div>
        <div class="branding-bar">
          <div class="brand-icon">AI</div>
          <div class="brand-text">AI코리아24 · AI 뉴스</div>
        </div>
      </div>
    </div>

    <div class="brand-watermark">
      <div class="brand-icon-sm">AI</div>
      <div class="brand-text-sm">AI코리아24</div>
    </div>
  </div>
</body>
</html>
