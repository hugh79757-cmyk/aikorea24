<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Instagram Reel Cover</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v2/dist/web/static/pretendard.css" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      word-break: keep-all;
    }

    .slide {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: #ffffff;
    }

    /* Decorative blur orbs — reel-sized */
    .slide::before {
      content: '';
      position: absolute;
      top: -160px;
      right: -160px;
      width: var(--orb-size-reel);
      height: var(--orb-size-reel);
      border-radius: 50%;
      background: rgba(168, 85, 247, 0.08);
      filter: blur(var(--orb-blur-reel, 100px));
      pointer-events: none;
      z-index: 0;
    }
    .slide::after {
      content: '';
      position: absolute;
      bottom: -160px;
      left: -160px;
      width: var(--orb-size-reel);
      height: var(--orb-size-reel);
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.06);
      filter: blur(var(--orb-blur-reel, 100px));
      pointer-events: none;
      z-index: 0;
    }

    .slide-inner {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: var(--padding-slide-y-reel) var(--padding-slide-x);
    }

    /* Top section: emoji + highlight (40% of height) */
    .top-section {
      flex: 0 0 40%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .emoji-prefix {
      font-size: var(--fs-emoji-reel);
      line-height: 1;
      margin-bottom: var(--spacing-content);
      display: block;
    }

    .highlight-number {
      font-size: var(--fs-highlight);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -4px;
      background: var(--grad-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Middle section: title + body (35% of height) */
    .middle-section {
      flex: 0 0 35%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .title {
      font-size: var(--fs-title);
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 40px;
      color: #ffffff;
    }

    .body {
      font-size: var(--fs-body);
      font-weight: 400;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.7);
      max-width: 900px;
    }

    /* Bottom section: branding */
    .bottom-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding-bottom: 40px;
    }

    .subtitle {
      font-size: var(--fs-subtitle);
      color: rgba(255, 255, 255, 0.4);
      font-weight: 500;
      margin-bottom: var(--spacing-small);
    }

    .branding-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
    }

    .brand-text {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 500;
    }
  </style>
</head>
<body style="background: #000;">
  <div class="slide $bg_class">
    <!-- Grain texture layer -->
    <div class="grain-overlay"></div>

    <div class="slide-inner">
      <div class="top-section">
        <span class="emoji-prefix">$emoji_prefix</span>
        <div class="highlight-number">$highlight_number</div>
      </div>

      <div class="middle-section">
        <div class="title">$title</div>
        <div class="slide-divider"></div>
        <div class="body">$body</div>
      </div>

      <div class="bottom-section">
        <div class="subtitle">$subtitle</div>
        <div class="branding-bar">
          <div class="brand-icon">AI</div>
          <div class="brand-text">AI코리아24 · AI 뉴스</div>
        </div>
      </div>
    </div>

    <div class="brand-watermark">
      <div class="brand-icon">AI</div>
      <div class="brand-text">AI코리아24</div>
    </div>
  </div>
  <script>
    document.fonts.ready.then(function() {
      document.body.dataset.fontsLoaded = 'true';
    });
  </script>
</body>
</html>
