<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1350">
  <title>Format D - Card 4</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>*{font-family:'Pretendard',sans-serif;}.carousel-card{width:1080px;height:1350px;}</style>
</head>
<body class="bg-white">
  <div class="carousel-card relative overflow-hidden bg-white flex flex-col">
    <div class="flex items-center justify-center pt-12 px-8">
      <div class="flex items-center gap-3">
        <span class="px-4 py-1.5 rounded-full bg-gradient-to-r from-#2563eb to-#7c3aed text-white text-sm font-semibold">펀치 브리핑</span>
        <span class="w-12 h-px bg-gradient-to-r from-#2563eb to-#7c3aed"></span>
        <span class="text-gray-400 text-sm">4/5</span>
      </div>
    </div>
    <div class="flex-1 flex flex-col">
      <div class="flex flex-col items-center justify-center px-16 py-20 relative">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-1 bg-gradient-to-r from-#2563eb via-#7c3aed to-#14b8a6"></div>
        <div class="absolute top-16 left-16 text-blue-600 font-bold text-4xl">4</div>
        <div class="text-center z-10">
          <p class="text-2xl font-semibold text-gray-500 mb-6">확장: 이게 왜 중요할까</p>
          <div class="space-y-6 max-w-3xl mx-auto">
            <div class="bg-blue-100 rounded-2xl p-8 border border-blue-200 text-left">
              <div class="flex items-center gap-4 mb-4">
                <div class="w-12 h-12 rounded-xl bg-blue-100 flex items-center justify-center"><svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
                <p class="text-xl font-bold text-gray-900">노조의 지적</p>
              </div>
              <p class="text-gray-600 leading-relaxed">"AI는 핑계일 뿐, 싼 나라로 아웃소싱 가속화"</p>
            </div>
            <div class="bg-purple-100 rounded-2xl p-8 border border-purple-200 text-left">
              <div class="flex items-center gap-4 mb-4">
                <div class="w-12 h-12 rounded-xl bg-purple-100 flex items-center justify-center"><svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg></div>
                <p class="text-xl font-bold text-gray-900">정부 경고</p>
              </div>
              <p class="text-gray-600 leading-relaxed">"AI가 만드는 파괴적 영향, 불확실성 그대로 보여줘"</p>
            </div>
            <div class="bg-teal-100 rounded-2xl p-8 border border-teal-200 text-left">
              <div class="flex items-center gap-4 mb-4">
                <div class="w-12 h-12 rounded-xl bg-teal-100 flex items-center justify-center"><svg class="w-6 h-6 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg></div>
                <p class="text-xl font-bold text-gray-900">핵심 포인트</p>
              </div>
              <p class="text-gray-600 leading-relaxed">AI가 제일 먼저 먹는 일자리 = 창의직이 아닌 <span class="font-bold text-red-600">'안전' 직군</span></p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="absolute bottom-16 left-1/2 -translate-x-1/2 flex items-center gap-3">
      <span class="w-8 h-8 rounded-full bg-gradient-to-r from-#2563eb to-#7c3aed flex items-center justify-center text-white font-bold text-xs">AI</span>
      <span class="text-gray-400 text-sm font-medium">aikorea24.kr</span>
    </div>
  </div>
</body>
</html>
