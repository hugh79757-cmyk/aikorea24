<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1350">
  <title>Instagram Carousel Slide</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v2/dist/web/static/pretendard.css" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      word-break: keep-all;
    }

    .slide {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: #ffffff;
    }

    /* Decorative blur orbs — template-specific sizes */
    .slide::before {
      content: '';
      position: absolute;
      top: -120px;
      right: -120px;
      width: var(--orb-size);
      height: var(--orb-size);
      border-radius: 50%;
      background: rgba(168, 85, 247, 0.08);
      filter: blur(var(--orb-blur, 80px));
      pointer-events: none;
      z-index: 0;
    }
    .slide::after {
      content: '';
      position: absolute;
      bottom: -120px;
      left: -120px;
      width: var(--orb-size);
      height: var(--orb-size);
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.06);
      filter: blur(var(--orb-blur, 80px));
      pointer-events: none;
      z-index: 0;
    }

    .slide-inner {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: var(--padding-slide-y) var(--padding-slide-x);
    }

    /* Top section: emoji + highlight number */
    .top-section {
      flex: 0 0 auto;
      margin-bottom: var(--spacing-section);
    }

    .emoji-prefix {
      font-size: var(--fs-emoji);
      line-height: 1;
      margin-bottom: var(--spacing-small);
      display: block;
    }

    .highlight-number {
      font-size: var(--fs-highlight);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -3px;
      background: var(--grad-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Middle section: title + body */
    .middle-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .title {
      font-size: var(--fs-title);
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: var(--spacing-content);
      color: #ffffff;
    }

    .body {
      font-size: var(--fs-body);
      font-weight: 400;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.7);
      max-width: 900px;
    }

    /* CTA-specific: center-aligned button */
    .cta-wrapper {
      flex: 0 0 auto;
      text-align: center;
      margin-top: var(--spacing-section);
    }

    /* Bottom section: subtitle */
    .bottom-section {
      flex: 0 0 auto;
      padding-top: 40px;
    }

    .subtitle {
      font-size: var(--fs-subtitle);
      color: rgba(255, 255, 255, 0.4);
      font-weight: 500;
    }

    /* Conditional elements: hidden by default, shown by slide type */
    .cta-wrapper { display: none; }
    .slide.bg-cta .cta-wrapper { display: block; }

    .section-label-wrapper { display: none; }
    .slide.bg-expansion .section-label-wrapper { display: block; }

    /* Swipe hint at bottom */
    .swipe-hint {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255, 255, 255, 0.35);
      font-size: 15px;
      font-weight: 500;
      animation: swipe-bounce 2s infinite;
      z-index: 1;
    }

    @keyframes swipe-bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-6px); }
    }

    .swipe-hint svg {
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body style="background: #000;">
  <div class="slide $bg_class">
    <!-- Grain texture layer -->
    <div class="grain-overlay"></div>

    <div class="slide-inner">
      <div class="top-section">
        <span class="emoji-prefix">$emoji_prefix</span>
        <div class="highlight-number">$highlight_number</div>
      </div>

      <div class="middle-section">
        <!-- Section label (shown for EXPANSION slides via CSS) -->
        <div class="section-label-wrapper">
          <div class="section-label">이게 의미하는 것</div>
        </div>
        <div class="title">$title</div>
        <div class="slide-divider"></div>
        <div class="body">$body</div>
        <!-- CTA button (shown for CTA slides via CSS) -->
        <div class="cta-wrapper">
          <div class="cta-button">AI코리아24에서 매일 브리핑 보기</div>
        </div>
      </div>

      <div class="bottom-section">
        <div class="subtitle">$subtitle</div>
      </div>
    </div>

    <div class="brand-watermark">
      <div class="brand-icon">AI</div>
      <div class="brand-text">AI코리아24</div>
    </div>

    <div class="swipe-hint">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      <span>스와이프해서 넘기기</span>
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    </div>
  </div>
  <script>
    document.fonts.ready.then(function() {
      document.body.dataset.fontsLoaded = 'true';
    });
  </script>
</body>
</html>
