<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1350">
  <title>Instagram Carousel Slide</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v2/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      word-break: keep-all;
    }

    :root {
      --bg-hook: linear-gradient(135deg, #1a0533 0%, #0D1117 100%);
      --bg-conflict: linear-gradient(135deg, #330a0a 0%, #0D1117 100%);
      --bg-twist: linear-gradient(135deg, #0a1a33 0%, #0D1117 100%);
      --bg-expansion: #1a1a2e;
      --bg-cta: linear-gradient(135deg, #0a3314 0%, #0D1117 100%);
      --bg-link: #0D1117;
      --bg-brand: linear-gradient(135deg, #0D1117 0%, #1a0533 100%);
      --accent-purple: #A855F7;
      --accent-red: #EF4444;
      --accent-blue: #3B82F6;
      --accent-green: #22C55E;
      --accent-yellow: #EAB308;
    }

    .slide {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: #ffffff;
    }

    .slide.bg-hook { background: var(--bg-hook); }
    .slide.bg-conflict { background: var(--bg-conflict); }
    .slide.bg-twist { background: var(--bg-twist); }
    .slide.bg-expansion { background: var(--bg-expansion); }
    .slide.bg-cta { background: var(--bg-cta); }
    .slide.bg-link { background: var(--bg-link); }
    .slide.bg-brand { background: var(--bg-brand); }

    /* Decorative blur orbs */
    .slide::before {
      content: '';
      position: absolute;
      top: -120px;
      right: -120px;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: rgba(168, 85, 247, 0.08);
      filter: blur(80px);
      pointer-events: none;
    }
    .slide::after {
      content: '';
      position: absolute;
      bottom: -120px;
      left: -120px;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.06);
      filter: blur(80px);
      pointer-events: none;
    }

    .slide-inner {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 80px 72px;
    }

    /* Top section: emoji + highlight number */
    .top-section {
      flex: 0 0 auto;
      margin-bottom: 48px;
    }

    .emoji-prefix {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 24px;
      display: block;
    }

    .highlight-number {
      font-size: 120px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -3px;
      background: linear-gradient(135deg, #A855F7, #3B82F6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Middle section: title + body */
    .middle-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .title {
      font-size: 48px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 32px;
      color: #ffffff;
    }

    .divider {
      width: 64px;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-blue));
      border-radius: 2px;
      margin-bottom: 32px;
    }

    .body {
      font-size: 28px;
      font-weight: 400;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.7);
      max-width: 900px;
    }

    /* Bottom section: subtitle */
    .bottom-section {
      flex: 0 0 auto;
      padding-top: 40px;
    }

    .subtitle {
      font-size: 20px;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 500;
    }

    /* Brand watermark */
    .brand-watermark {
      position: absolute;
      bottom: 32px;
      right: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0.3;
    }

    .brand-watermark .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
    }

    .brand-watermark .brand-text {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
    }

    /* Swipe hint at bottom */
    .swipe-hint {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255, 255, 255, 0.35);
      font-size: 15px;
      font-weight: 500;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-6px); }
    }

    .swipe-hint svg {
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body style="background: #000;">
  <div class="slide $bg_class">
    <div class="slide-inner">
      <div class="top-section">
        <span class="emoji-prefix">$emoji_prefix</span>
        <div class="highlight-number">$highlight_number</div>
      </div>

      <div class="middle-section">
        <div class="title">$title</div>
        <div class="divider"></div>
        <div class="body">$body</div>
      </div>

      <div class="bottom-section">
        <div class="subtitle">$subtitle</div>
      </div>
    </div>

    <div class="brand-watermark">
      <div class="brand-icon">AI</div>
      <div class="brand-text">AI코리아24</div>
    </div>

    <div class="swipe-hint">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      <span>스와이프해서 넘기기</span>
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    </div>
  </div>
</body>
</html>
