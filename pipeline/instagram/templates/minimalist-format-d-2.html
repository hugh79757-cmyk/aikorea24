<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1350">
  <title>Format D - Card 2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>*{font-family:'Pretendard',sans-serif;}.carousel-card{width:1080px;height:1350px;}</style>
</head>
<body class="bg-white">
  <div class="carousel-card relative overflow-hidden bg-white flex flex-col">
    <div class="flex items-center justify-center pt-12 px-8">
      <div class="flex items-center gap-3">
        <span class="px-4 py-1.5 rounded-full bg-gradient-to-r from-#2563eb to-#7c3aed text-white text-sm font-semibold">펀치 브리핑</span>
        <span class="w-12 h-px bg-gradient-to-r from-#2563eb to-#7c3aed"></span>
        <span class="text-gray-400 text-sm">2/5</span>
      </div>
    </div>
    <div class="flex-1 flex flex-col">
      <div class="flex flex-col items-center justify-center px-16 py-20 relative">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-1 bg-gradient-to-r from-#2563eb via-#7c3aed to-#14b8a6"></div>
        <div class="absolute top-16 left-16 text-blue-600 font-bold text-4xl">2</div>
        <div class="text-center z-10">
          <p class="text-2xl font-semibold text-gray-500 mb-6">충돌 A면: 무엇이 문제인가</p>
          <div class="bg-gray-50 rounded-2xl p-10 mb-8 max-w-3xl mx-auto border border-gray-100">
            <p class="text-3xl font-bold text-gray-900 leading-tight mb-6">
              잘리는 팀 = <span class="text-red-600">자살 챌린지 영상</span>을<br>
              사람 눈으로 걸러내던 <span class="text-gray-900">검수팀</span>
            </p>
            <div class="w-20 h-0.5 bg-red-500 mx-auto mb-6"></div>
            <p class="text-lg text-gray-600 leading-relaxed">
              더블린 전체 직원의 40%<br>
              ADSO(AI 데이터 서비스·운영)팀 전원
            </p>
          </div>
          <div class="flex items-center justify-center gap-4 text-sm text-gray-500">
            <span class="flex items-center gap-1"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg> 사람 눈 필요</span>
            <span class="flex items-center gap-1"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z"/></svg> 알고리즘 우회</span>
          </div>
        </div>
      </div>
    </div>
    <div class="absolute bottom-16 left-1/2 -translate-x-1/2 flex items-center gap-3">
      <span class="w-8 h-8 rounded-full bg-gradient-to-r from-#2563eb to-#7c3aed flex items-center justify-center text-white font-bold text-xs">AI</span>
      <span class="text-gray-400 text-sm font-medium">aikorea24.kr</span>
    </div>
  </div>
</body>
</html>
