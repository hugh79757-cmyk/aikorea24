<svg xmlns="http://www.w3.org/2000/svg" width="200" height="48" viewBox="0 0 200 48" role="img" aria-label="Featured on AI코리아24">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0B1120;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="200" height="48" rx="10" ry="10" fill="url(#bgDark)"/>

  <!-- Left shield icon -->
  <g transform="translate(14,24)">
    <path d="M0,2 L0,10 C0,16 6,20 10,22 C14,20 20,16 20,10 L20,2 C14,6 6,6 0,2Z"
          fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.9"/>
    <path d="M4,10 L9,15 L16,6" fill="none" stroke="url(#gold)" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text: Featured on -->
  <text x="42" y="20" font-family="system-ui,-apple-system,sans-serif"
        font-size="9" font-weight="500" fill="#94A3B8" letter-spacing="0.5">
    Featured on
  </text>

  <!-- Text: AI코리아24 -->
  <text x="42" y="34" font-family="system-ui,-apple-system,sans-serif"
        font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="-0.2">
    AI코리아24
  </text>

  <!-- Right gold star -->
  <g transform="translate(182,24)">
    <circle cx="0" cy="0" r="8" fill="url(#gold)" opacity="0.15"/>
    <path d="M0,-5 L1.2,-1.5 L5,-1.5 L2,1 L3,5 L0,2.5 L-3,5 L-2,1 L-5,-1.5 L-1.2,-1.5 Z"
          fill="url(#gold)" filter="url(#glow)"/>
  </g>

  <!-- Subtle border -->
  <rect x="0.5" y="0.5" width="199" height="47" rx="9.5" ry="9.5"
        fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
</svg>