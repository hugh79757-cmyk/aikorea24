# config/models.yaml — 쓰레드 파이프라인 무료 LLM 폴백 체인 (순수 회전)
# 순서 = 초기 큐 순서. 성공 tier가 front 고정, 실패는 뒤로 회전.
# 유료 default(DeepSeek V4 Flash)는 항상 맨 뒤 — 최후 수단.
# 참고: ~/.config/opencode/skills/llm-fallback-chain-management/SKILL.md
# 갱신: 2026-09-10 (ultra-550b 93s 제외, Orca/Mistral/Cohere 검증 티어 추가)

tier_order:
  - groq-qwen
  - groq-gpt120b
  - groq-gpt20b
  - orca-ds4free
  - orca-hy3
  - mistral-codestral
  - cohere-commanda
  - zhipu-glm
  - default            # ★ 유료 DeepSeek — 최후 수단

providers:
  groq:
    api_key_env: GROQ_API_KEY
    base_url: "https://api.groq.com/openai/v1"
  orca:
    api_key_env: ORCA_API_KEY
    base_url: "https://api.orcarouter.ai/v1"
  mistral:
    api_key_env: MISTRAL_API_KEY
    base_url: "https://api.mistral.ai/v1"
  cohere:
    api_key_env: COHERE_API_KEY
    base_url: "https://api.cohere.com/compatibility/v1"
  zhipu:
    api_key_env: ZHIPU_API_KEY
    base_url: "https://open.bigmodel.cn/api/paas/v4"
  deepseek:
    api_key_env: DEEPSEEK_API_TOKEN
    base_url: "https://api.deepseek.com/v1"

models:
  groq-qwen:
    provider: groq
    model: qwen/qwen3.6-27b
    reasoning_effort: none
  groq-gpt120b:
    provider: groq
    model: openai/gpt-oss-120b
  groq-gpt20b:
    provider: groq
    model: openai/gpt-oss-20b
  orca-ds4free:
    provider: orca
    model: deepseek/deepseek-v4-flash-free
  orca-hy3:
    provider: orca
    model: tencent/hy3-free
  mistral-codestral:
    provider: mistral
    model: codestral-latest
  cohere-commanda:
    provider: cohere
    model: command-a-03-2025
  zhipu-glm:
    provider: zhipu
    model: glm-4.5-flash
  default:
    provider: deepseek
    model: deepseek-v4-flash    # ★ 유료 — 최후 수단
