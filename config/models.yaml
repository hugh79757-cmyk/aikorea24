# config/models.yaml — 쓰레드 파이프라인 무료 LLM 폴백 체인
# 순서 = 우선순위 (1순위부터). 전부 실패하면 체인 실패(유료 tier 없음)
# 참고: /Users/twinssn/Projects/SKILL.md "LLM Fallback Chain"
# 갱신: 2026-10-14 (Groq 4계정 × 3모델 = 12tier 로 확장 — 아래 갱신 이력 참조)
# 갱신: 2026-10-13 (유료 deepseek tier 제거 — 아래 삭제 이력 참조)
# 갱신: 2026-10-05 (nvidia-nemotron 품질 사고로 체인 제외 — 아래 삭제 이력 참조)
# 갱신: 2026-09-29 (죽은 tier 9개 제거 — 아래 삭제 이력 참조)
#
# 갱신 이력 (2026-10-14 Groq 다계정 확장 — 소유자 지시 "groq키 추가했으면 됐다"):
#   계정 3~4개 × 모델 3개 조합으로 tier 를 늘렸다. 무료 티어는 계정별 일일/분당
#   한도라, 같은 모델을 여러 계정이 번갈아 쓰면 소모가 계정 단위로 분산된다
#   (스킬 §Property 3 "All models get used evenly" 와 같은 취지).
#   계정당 모델 3개 실측(2026-10-14, Groq /models + chat 1회 호출 × 4키):
#     openai/gpt-oss-120b  : 4키 전부 HTTP 200 동작
#     openai/gpt-oss-20b   : 4키 전부 HTTP 200 동작
#     qwen/qwen3.8-27b     : 목록에 존재(4키 동일 11개 목록)
#     llama-3.3-70b-versatile          : 4키 전부 404 model 없음
#     llama-3.1-8b-instant             : 4키 전부 404 model 없음
#     meta-llama/llama-4-scout-17b-…   : 4키 전부 404 model 없음
#   주의: gpt-oss 계열은 reasoning 모델이다. max_tokens 가 작으면 추론 토큰에 다 쓰이고
#     content 가 빈 채 finish_reason=length 로 끝난다 → 호출자는 충분한 max_tokens 를 줘야 한다.
#   4개 키의 /models 응답은 완전히 동일했다(권한 차이 없음). 차이는 전적으로 한도다.
#
# 삭제 이력 (2026-10-13 소유자 결정 — 대표님 지시 "유료모델 deepseek는 제거하라"):
#   default (deepseek-v4-flash) : 유료 tier. 2026-10-13 실행에서 HTTP 401
#                     "Your api key: ****5f76 is invalid" 로 매 pass 실패.
#                     돈을 쓰지도 못하면서 요청 1회를 낭비하고 있었다.
#                     스킬 llm-fallback-chain-management §Rotation contract
#                     "Removing from config is an owner decision" 에 따라 제거.
#                     재등재 시 소유자 승인 필요.
#                     (model_router 의 deepseek 단독 경로는 config 부재 시에만 발동하므로 무영향)
#
# 삭제 이력 (2026-10-05 품질 사고 — 소유자 결정, 재등재 시 승인 필요):
#   nvidia-nemotron : nvidia/nemotron-3-ultra-550b-a55b.
#                     스킬 llm-fallback-chain-management §Dead/excluded 2026-09-13
#                     "nemotron 계열은 한국어 콘텐츠 생성 부적합" 소유자 결정의 대상이나
#                     이 프로젝트 tier_order에 잔존해 있었음. 2026-10-05 제외 확정.
#                     한국어 번역/문장 생성 품질 부적합 — 계정 무관. 재검증 없이 복귀 금지.
#                     (NVIDIA_API_KEY 자체는 키 문제 아님 — 모델 문제. 키는 다른 tier 용도 대비 보존.)
#
# 삭제 이력 (2026-09-29 직접 curl 실측):
#   gemini-2.5-flash   : 404 "no longer available to new users"
#   groq-llama         : 404 model_not_found (llama-3.3-70b-versatile) — 2026-10-14 재확인
#   groq-qwen          : 404 model_not_found (qwen/qwen3.6-27b)
#   cerebras-gemma     : 404 model_archived (gemma-4-31b)
#   cerebras-glm       : 404 model_archived (zai-glm-4.7)
#   zen-deepseek-free  : 400 "Upstream request failed: Model is unavailable"
#   zen-mimo-free      : 403 FreeTierError (OpenCode 내부에서만 사용 가능)
#   zen-bigpickle      : 403 FreeTierError (동일)
#   nvidia-step        : 410 Gone (stepfun-ai/step-3.7-flash EOL)
# 살아있음 확인: gemini-3.1-flash-lite(429 일일쿼터 500), gemini-3.5-flash-lite,
#   gemini-3.5-flash(503 일시), groq-gpt120b, groq-gpt20b, nvidia-nemotron, zhipu-glm

tier_order:
  - gemini-3.1-flash-lite
  - gemini-3.5-flash-lite
  - gemini-3.5-flash
  - groq1-gpt120b
  - groq1-gpt20b
  - groq1-qwen27b
  - groq2-gpt120b
  - groq2-gpt20b
  - groq2-qwen27b
  - groq3-gpt120b
  - groq3-gpt20b
  - groq3-qwen27b
  - groq4-gpt120b
  - groq4-gpt20b
  - groq4-qwen27b
  - zhipu-glm
  # 유료 tier 없음 (2026-10-13 제거). 전부 실패하면 체인 실패 — 배제·쿨다운 없음.

providers:
  google:
    api_key_env: GEMINI_API_KEY
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
  # Groq 4계정 — 무료 티어 한도가 계정별이라 provider 를 계정 단위로 분리한다.
  # model_router.get_provider_client 의 캐시 키에 api_key_env 가 포함되어야 한다.
  groq1:
    api_key_env: GROQ_API_KEY
    base_url: "https://api.groq.com/openai/v1"
  groq2:
    api_key_env: GROQ_API_KEY_2
    base_url: "https://api.groq.com/openai/v1"
  groq3:
    api_key_env: GROQ_API_KEY_3
    base_url: "https://api.groq.com/openai/v1"
  groq4:
    api_key_env: GROQ_API_KEY_4
    base_url: "https://api.groq.com/openai/v1"
  zhipu:
    api_key_env: ZHIPU_API_KEY
    base_url: "https://open.bigmodel.cn/api/paas/v4"
  # deepseek provider 제거 (2026-10-13 — 유료 tier 삭제 이력 참조)

models:
  gemini-3.1-flash-lite:
    provider: google
    model: gemini-3.1-flash-lite
  gemini-3.5-flash-lite:
    provider: google
    model: gemini-3.5-flash-lite
  gemini-3.5-flash:
    provider: google
    model: gemini-3.5-flash
  groq1-gpt120b:
    provider: groq1
    model: openai/gpt-oss-120b
  groq1-gpt20b:
    provider: groq1
    model: openai/gpt-oss-20b
  groq1-qwen27b:
    provider: groq1
    model: qwen/qwen3.8-27b
  groq2-gpt120b:
    provider: groq2
    model: openai/gpt-oss-120b
  groq2-gpt20b:
    provider: groq2
    model: openai/gpt-oss-20b
  groq2-qwen27b:
    provider: groq2
    model: qwen/qwen3.8-27b
  groq3-gpt120b:
    provider: groq3
    model: openai/gpt-oss-120b
  groq3-gpt20b:
    provider: groq3
    model: openai/gpt-oss-20b
  groq3-qwen27b:
    provider: groq3
    model: qwen/qwen3.8-27b
  groq4-gpt120b:
    provider: groq4
    model: openai/gpt-oss-120b
  groq4-gpt20b:
    provider: groq4
    model: openai/gpt-oss-20b
  groq4-qwen27b:
    provider: groq4
    model: qwen/qwen3.8-27b
  zhipu-glm:
    provider: zhipu
    model: glm-4.5-flash
  # default(deepseek-v4-flash) 항목 제거 (2026-10-13 — 유료 tier 삭제 이력 참조)